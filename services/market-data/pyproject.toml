[project]
name = "qm-market-data"
version = "0.1.0"
description = "QuantMind AI market-data service (PC 1)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "polars>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "redis>=5.0",
  "asyncpg>=0.29",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "rfc3339-validator>=0.1.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qm_md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs Redis or PostgreSQL; skipped when unavailable"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["prometheus_client", "prometheus_client.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["qm_md"]
branch = true
