version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: quantmind-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: quantmind-postgres
    environment:
      POSTGRES_USER: quantmind
      POSTGRES_PASSWORD: 80c34de091b01dcd4c9208f1e4fae516
      POSTGRES_DB: quantmind
    ports:
      - "5432:5432"
    volumes:
      - quantmind_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  quantmind_pgdata:
