# Prometheus scrape configuration.
# Service targets are added by their owners when the services exist.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

